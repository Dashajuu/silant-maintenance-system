{% extends 'default.html' %}

{% load static %}

{% block head_link %}
    <link rel="stylesheet" href="{% static 'css/form.css' %}" />
{% endblock %}


{% block title %}{{ title }}{% endblock %}

{% block main %}
  <div class="form-page">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <input type="submit" value="Создать">
    </form>
  </div>
{% endblock %}
